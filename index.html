<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pioneer Notes</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; resize: vertical; min-height: 80px; }
    button { margin-top: 8px; padding: 10px 20px; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #notes { margin-top: 40px; }
    .note { border-bottom: 1px solid #eee; padding: 12px 0; }
    .note p { margin: 0 0 4px; }
    .note-footer { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .note time { font-size: 0.8rem; color: #999; }
    .share-btn { font-size: 0.8rem; padding: 3px 10px; background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; color: #555; }
    .share-btn:hover { border-color: #111; color: #111; }
    .share-btn:disabled { opacity: 0.5; cursor: default; }
    .share-status { font-size: 0.8rem; margin: 2px 0 0; }
    #status { margin-top: 8px; font-size: 0.9rem; color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Pioneer Notes</h1>

  <textarea id="body" placeholder="Write a note…"></textarea>
  <button id="submit">Post note</button>
  <p id="status"></p>

  <div id="notes"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
